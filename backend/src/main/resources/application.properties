spring.application.name=backend

openweather.base-url=https://api.openweathermap.org
ignav.base-url=https://ignav.com/api
googleplaces.base-url=https://places.googleapis.com/v1

spring.datasource.url=jdbc:postgresql://localhost:5432/travel_planner
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.servlet.context-path=/api
solarwatch.jwt.secret=${TRAVEL_PLANNER_JWT_SECRET}
solarwatch.jwt.expiration-ms=${TRAVEL_PLANNER_JWT_EXPIRATION_MS}

logging.level.org.springframework.security=DEBUG
