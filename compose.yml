services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d travel_planner" ]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travel_planner
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      IGNAV_API_KEY: ${IGNAV_API_KEY}
      TRAVEL_PLANNER_JWT_SECRET: ${TRAVEL_PLANNER_JWT_SECRET}
      TRAVEL_PLANNER_JWT_EXPIRATION_MS: ${TRAVEL_PLANNER_JWT_EXPIRATION_MS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    ports:
      - "3000:80"

volumes:
  pgdata:


